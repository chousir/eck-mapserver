[defaults]
inventory           = inventory/hosts
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = default
# ansible-core >= 2.13 built-in; the old community.general `yaml` callback
# is deprecated/removed and may be missing on an ansible-core-only install.
callback_result_format = yaml
timeout             = 30

[privilege_escalation]
become = False
