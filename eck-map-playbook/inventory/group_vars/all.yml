---
# Everything here is optional — defaults (roles/kubectl/eck-map/defaults/main.yml)
# already match the standard environment. Uncomment only what differs.

# Empty = MetalLB auto-assigns an IP; the playbook prints it at the end.
# Paste it here afterwards to pin it (Kibana's map.tilemap.url depends on it),
# or set it up front if Kibana's config is written before this playbook runs.
eck_map_tile_vip: ""

# Optional one-time integrity check (doc §1.3) — reads the whole ~95GB file.
# eck_map_mbtiles_sha256: "60a37d2324a27c18798570b9193534c1b88a2a564c10a808a03a419e8dd15ea1"

# eck_map_mbtiles_path: "/var/lib/tileserver/tiles.mbtiles"
# eck_map_cert_issuer_name: "ca-issuer"
# eck_map_cert_duration: "8760h"
# eck_map_image_registry: ""          # empty = pull via the Nexus containerd mirror
# eck_map_k8s_node_hostname: "k8s-controller01"   # only if it differs from the inventory name
