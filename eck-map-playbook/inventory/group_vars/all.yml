---
# Per-deployment values. Everything else lives in
# roles/kubectl/eck-map/defaults/main.yml.

# Empty = MetalLB auto-assigns an IP; the playbook prints it at the end.
# Paste it here afterwards to pin it (Kibana's map.tilemap.url depends on it),
# or set it up front if Kibana's config is written before this playbook runs.
eck_map_tile_vip: ""

# Optional one-time integrity check (doc §1.3) — reads the whole ~95GB file.
# Empty = skip. To verify, set it to:
#   60a37d2324a27c18798570b9193534c1b88a2a564c10a808a03a419e8dd15ea1
eck_map_mbtiles_sha256: ""
eck_map_mbtiles_path: "/var/lib/tileserver/tiles.mbtiles"
eck_map_pv_storage_size: 150Gi              # ≥1.2x the actual file size

# ── Images ────────────────────────────────────────────────────────────────
eck_map_tileserver_image: maptiler/tileserver-gl:v5.6.0
eck_map_nginx_image: nginx:1.23.0-alpine
