---
# Only checks what this playbook can't see fail clearly on its own: the
# user-placed tiles.mbtiles. Everything else (kubectl, cert-manager,
# ca-issuer, MetalLB) is part of the fixed kubespray environment.
- name: Stat tiles.mbtiles (SHA256 only when eck_map_mbtiles_sha256 is set — reads ~95GB)
  ansible.builtin.stat:
    path: "{{ eck_map_mbtiles_path }}"
    get_checksum: "{{ eck_map_mbtiles_sha256 | length > 0 }}"
    checksum_algorithm: sha256
  register: eck_map_mbtiles

- name: Stat the directory containing tiles.mbtiles
  ansible.builtin.stat:
    path: "{{ eck_map_mbtiles_path | dirname }}"
  register: eck_map_mbtiles_dir

- name: Assert tiles.mbtiles is in place and readable by the non-root container
  ansible.builtin.assert:
    that:
      - eck_map_mbtiles.stat.isreg | default(false)
      - eck_map_mbtiles.stat.roth
      - eck_map_mbtiles_dir.stat.roth and eck_map_mbtiles_dir.stat.xoth
      - eck_map_mbtiles_sha256 | length == 0 or eck_map_mbtiles.stat.checksum == eck_map_mbtiles_sha256 | lower
    fail_msg: >-
      {{ eck_map_mbtiles_path }} must exist, be world-readable, and its
      directory world-readable+traversable (tileserver-gl runs as non-root);
      if eck_map_mbtiles_sha256 is set, the checksum must match. Fix:
      sudo chmod o+rx {{ eck_map_mbtiles_path | dirname }} &&
      sudo chmod o+r {{ eck_map_mbtiles_path }}
