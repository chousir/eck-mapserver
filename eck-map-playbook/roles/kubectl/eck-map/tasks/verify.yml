---
- name: Wait for the tileserver rollout to finish
  ansible.builtin.command: kubectl -n {{ eck_map_namespace }} rollout status deployment/tileserver --timeout=300s
  changed_when: false

# Covers TLS (nginx sidecar), tileserver itself, and config.json (doc §2:
# without it styles.json is empty). validate_certs: false only proves the
# server works — browser trust is checked by hand (doc §6.5).
- name: "Smoke check: https://<tile IP>/styles.json contains basic-preview"
  ansible.builtin.uri:
    url: "https://{{ eck_map_tile_ip }}/styles.json"
    validate_certs: false
    return_content: true
  register: eck_map_styles
  until: eck_map_styles.status == 200 and 'basic-preview' in eck_map_styles.content
  retries: 12
  delay: 5

- name: Read the issued TLS Secret
  ansible.builtin.command: kubectl -n {{ eck_map_namespace }} get secret tileserver-tls -o json
  register: eck_map_tls_secret
  changed_when: false

- name: Copy ca.crt to the Ansible control node
  ansible.builtin.copy:
    content: "{{ (eck_map_tls_secret.stdout | from_json).data['ca.crt'] | b64decode }}"
    dest: "{{ eck_map_ca_export_path }}"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Next steps (Kibana config + browser trust)
  ansible.builtin.debug:
    msg:
      - "Tile server: https://{{ eck_map_tile_ip }}/"
      - "Add to Kibana (ECK Kibana CR spec.config, or eck-stack values eck-kibana.config):"
      - "  map.includeElasticMapsService: false"
      - "  map.tilemap.url: \"https://{{ eck_map_tile_ip }}/styles/basic-preview/{z}/{x}/{y}.png\""
      - "Import {{ eck_map_ca_export_path }} into users' browser/OS trust store."
      - "{{ '' if eck_map_tile_vip else 'IP was auto-assigned by MetalLB — set eck_map_tile_vip: \"' + eck_map_tile_ip + '\" in group_vars to pin it.' }}"
