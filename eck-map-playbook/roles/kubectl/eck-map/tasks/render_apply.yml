---
- name: Ensure remote manifest directory exists
  ansible.builtin.file:
    path: "{{ eck_map_remote_manifest_dir }}"
    state: directory
    mode: "0700"

- name: Render all K8s manifests to the remote host
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ eck_map_remote_manifest_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - 00-namespace.yml
    - 05-issuer.yml
    - 10-certificate.yml
    - 15-nginx-config.yml
    - 20-config.yml
    - 30-pv.yml
    - 40-deployment.yml
  loop_control:
    label: "{{ item }}"

# ── Apply order matters: Namespace must exist before anything that
#    references `namespace: {{ eck_map_namespace }}`, and the Certificate's
#    Secret must exist before the Deployment mounts it (doc §4.4). ──────────

- name: "Apply 00-namespace.yml (must be first)"
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/00-namespace.yml'] }}"
  register: eck_map_r00
  changed_when: eck_map_r00.stdout is search('(created|configured)')

- name: Apply 05-issuer.yml (SelfSigned Issuer — only when the role creates its own)
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/05-issuer.yml'] }}"
  register: eck_map_r05
  changed_when: eck_map_r05.stdout is search('(created|configured)')
  when: eck_map_cert_manager_create_selfsigned_issuer

- name: Apply 10-certificate.yml
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/10-certificate.yml'] }}"
  register: eck_map_r10
  changed_when: eck_map_r10.stdout is search('(created|configured)')
  notify: restart tileserver deployment

- name: Wait for the tileserver-tls Certificate to become Ready
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['-n', eck_map_namespace, 'wait', '--for=condition=Ready', 'certificate/' + eck_map_certificate_name, '--timeout=' + eck_map_cert_wait_timeout] }}"
  register: eck_map_cert_wait
  changed_when: false
  failed_when: false

- name: Fail clearly if the Certificate never became Ready
  ansible.builtin.fail:
    msg: >-
      Certificate {{ eck_map_certificate_name }} did not become Ready within
      {{ eck_map_cert_wait_timeout }}. Usually means eck_map_cert_issuer_name/
      eck_map_cert_issuer_kind points at an Issuer/ClusterIssuer that doesn't
      exist or can't issue. Check:
      kubectl -n {{ eck_map_namespace }} describe certificate {{ eck_map_certificate_name }}
  when: eck_map_cert_wait.rc != 0

- name: Apply 15-nginx-config.yml
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/15-nginx-config.yml'] }}"
  register: eck_map_r15
  changed_when: eck_map_r15.stdout is search('(created|configured)')
  notify: restart tileserver deployment

- name: Apply 20-config.yml (tileserver-gl config.json)
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/20-config.yml'] }}"
  register: eck_map_r20
  changed_when: eck_map_r20.stdout is search('(created|configured)')
  notify: restart tileserver deployment

- name: Apply 30-pv.yml (PersistentVolume + PersistentVolumeClaim)
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/30-pv.yml'] }}"
  register: eck_map_r30
  changed_when: eck_map_r30.stdout is search('(created|configured)')

- name: Apply 40-deployment.yml (Deployment + Service)
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['apply', '-f', eck_map_remote_manifest_dir + '/40-deployment.yml'] }}"
  register: eck_map_r40
  changed_when: eck_map_r40.stdout is search('(created|configured)')

- name: Flush handlers (so a ConfigMap/Certificate-triggered restart is underway before verification)
  ansible.builtin.meta: flush_handlers
