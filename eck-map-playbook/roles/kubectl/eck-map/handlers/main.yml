---
# No native "restart on ConfigMap/Secret change" primitive is available
# without the kubernetes.core collection (deliberately not used here), so a
# rollout restart is triggered explicitly whenever a ConfigMap or the
# Certificate changes. By construction the Deployment always already exists
# by the time this fires (it's applied last, after flush_handlers), so
# there's no risk of restarting something that doesn't exist yet. On a
# brand-new install this does cause one harmless extra restart right after
# initial creation — accepted trade-off, costs ~10-30s.
- name: restart tileserver deployment
  ansible.builtin.command:
    argv: "{{ [eck_map_kubectl_bin] + eck_map_kubectl_base_args + ['-n', eck_map_namespace, 'rollout', 'restart', 'deployment/' + eck_map_deployment_name] }}"
  changed_when: true
