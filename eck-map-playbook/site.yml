---
# Run from this directory: cd eck-map-playbook && ansible-playbook site.yml
# (ansible.cfg is only auto-loaded from the current working directory.)
#
# Fixed environment this playbook assumes (see README):
#   - kubespray v2.31.0 cluster: kubectl + /root/.kube/config on the control
#     plane (hence become: true), MetalLB, cert-manager with the `ca-issuer`
#     CA ClusterIssuer.
#   - tileserver-gl v5.6.0 and nginx 1.30-alpine pullable via the Nexus
#     containerd mirror — this role never builds, loads, tags, or pushes images.
#   - tiles.mbtiles already placed at eck_map_mbtiles_path — this role never
#     transfers it.

- name: Deploy ECK offline basemap (tileserver-gl + nginx TLS sidecar)
  hosts: k8s_controller
  gather_facts: false
  become: true
  roles:
    - kubectl/eck-map
